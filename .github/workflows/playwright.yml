name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * *' # nightly regression, 08:00 IST
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14

  regression:
    name: Full regression
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 14
